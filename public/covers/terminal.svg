<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="终端窗口插画">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10" />
      <stop offset="0.6" stop-color="#0c1418" />
      <stop offset="1" stop-color="#0f1f24" />
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2dd4bf" opacity="0.14" />
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)" />
  <rect width="640" height="400" fill="url(#dots)" />
  <rect x="0" y="330" width="640" height="70" fill="url(#glow)" />

  <rect x="96" y="96" width="448" height="208" rx="12" fill="#0f141a" stroke="#2c3743" stroke-width="1.5" />
  <line x1="96" y1="136" x2="544" y2="136" stroke="#1d2530" stroke-width="1.5" />
  <circle cx="118" cy="116" r="4.5" fill="#ff5f57" />
  <circle cx="134" cy="116" r="4.5" fill="#febc2e" />
  <circle cx="150" cy="116" r="4.5" fill="#28c840" />
  <rect x="176" y="111" width="92" height="9" rx="4.5" fill="#1d2530" />

  <rect x="118" y="158" width="14" height="9" rx="2" fill="#2dd4bf" />
  <rect x="140" y="158" width="126" height="9" rx="4.5" fill="#3a4a56" />
  <rect x="140" y="178" width="196" height="9" rx="4.5" fill="#1d2530" />
  <rect x="140" y="198" width="152" height="9" rx="4.5" fill="#1d2530" />

  <rect x="118" y="228" width="14" height="9" rx="2" fill="#2dd4bf" />
  <rect x="140" y="228" width="88" height="9" rx="4.5" fill="#3a4a56" />
  <rect x="140" y="248" width="232" height="9" rx="4.5" fill="#1d2530" />

  <rect x="118" y="276" width="14" height="9" rx="2" fill="#2dd4bf" />
  <rect x="140" y="276" width="8" height="10" rx="1.5" fill="#5eead4">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite" />
  </rect>
</svg>
